<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô phỏng thuật toán bằng AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #090a1c; --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.09);
    --line: rgba(255,255,255,.12); --text: #eef0ff; --muted: #9ba3c7;
    --violet: #8b6bff; --cyan: #22d3ee; --pink: #ff5fa2; --amber: #ffb547; --green: #34d399; --slate: #94a3b8;
    --grad: linear-gradient(135deg, #8b6bff 0%, #ff5fa2 55%, #ffb547 100%);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.5 "Be Vietnam Pro", system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  body::before, body::after { content: ""; position: fixed; z-index: 0; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .32; pointer-events: none; }
  body::before { background: radial-gradient(circle, var(--violet), transparent 65%); top: -22vmax; left: -12vmax; animation: drift 22s ease-in-out infinite alternate; }
  body::after { background: radial-gradient(circle, var(--pink), transparent 65%); bottom: -26vmax; right: -14vmax; animation: drift 28s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(7vmax, 5vmax) scale(1.12); } }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: 300px 1fr; height: 100dvh; }

  /* Sidebar */
  .side { display: flex; flex-direction: column; min-height: 0; background: rgba(12,13,36,.72); backdrop-filter: blur(18px); border-right: 1px solid var(--line); }
  .brand { display: flex; gap: 12px; align-items: center; padding: 20px 18px 14px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; box-shadow: 0 6px 22px rgba(255,95,162,.4); flex: none; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 14px 12px; }
  .stat { padding: 10px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 20px; font-weight: 800; line-height: 1.1; }
  .stat:nth-child(1) b { color: var(--amber); } .stat:nth-child(2) b { color: var(--cyan); }
  .stat span { font-size: 12px; color: var(--muted); }
  .new { margin: 0 14px 8px; padding: 10px 12px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.25); background: transparent; text-align: left; color: var(--muted); }
  .new:hover { border-color: var(--pink); color: var(--text); background: rgba(255,95,162,.08); }
  .side-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .link { background: none; border: 0; padding: 2px 4px; font-size: 13px; color: var(--muted); border-radius: 4px; }
  .link:hover { color: var(--pink); }
  #history { list-style: none; margin: 0; padding: 0 10px 14px; overflow-y: auto; flex: 1; min-height: 0; }
  #history li { position: relative; margin-bottom: 2px; }
  .h-item { width: 100%; text-align: left; background: none; border: 0; border-radius: 12px; padding: 9px 34px 9px 12px; display: flex; gap: 10px; align-items: center; }
  .h-item:hover { background: var(--glass); }
  li.active .h-item { background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--c); }
  .h-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; font-size: 15px; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
  .h-txt { min-width: 0; }
  .h-title { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-time { display: block; font-size: 12px; color: var(--muted); }
  .h-del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 16px; line-height: 1; opacity: 0; }
  #history li:hover .h-del, .h-del:focus-visible { opacity: 1; }
  .h-del:hover { background: rgba(255,95,162,.2); color: var(--pink); }
  .h-empty { padding: 10px 12px; font-size: 13px; color: var(--muted); }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; gap: 10px; align-items: center; padding: 16px 22px 10px; }
  .menu { display: none; width: 44px; height: 44px; flex: none; border-radius: var(--radius); border: 1px solid var(--line); background: var(--glass); }
  .field { flex: 1; min-width: 0; padding: 2px; border-radius: 16px; background: var(--line); transition: background .2s; }
  .field:focus-within { background: var(--grad); box-shadow: 0 0 28px rgba(139,107,255,.35); }
  #q { width: 100%; padding: 12px 16px; border: 0; border-radius: 14px; background: #12132f; font-size: 15px; outline: 0; }
  #q::placeholder { color: #6a7099; }
  .btn { padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-2); font-weight: 600; white-space: nowrap; transition: transform .12s, border-color .15s; }
  .btn:hover:not(:disabled) { border-color: rgba(255,255,255,.35); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { border: 0; background: var(--grad); color: #fff; box-shadow: 0 6px 22px rgba(255,95,162,.35); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
  .btn:disabled { opacity: .55; cursor: wait; }

  .meta { display: flex; align-items: center; gap: 10px; padding: 4px 24px 10px; min-height: 40px; font-size: 14px; color: var(--muted); }
  #status { flex: 1; min-width: 0; }
  #status.err { color: #ff8fa3; } #status.ok { color: var(--green); }
  .tag { display: inline-block; padding: 2px 10px; margin-right: 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
  .tools .btn { padding: 6px 12px; font-size: 13px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--cyan); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  #stage { flex: 1; min-height: 0; margin: 0 22px 22px; border-radius: 18px; overflow: hidden; position: relative; background: rgba(12,13,36,.6); border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  #stage.live { border-color: transparent; box-shadow: 0 0 0 1.5px rgba(139,107,255,.7), 0 20px 70px rgba(139,107,255,.25); }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

  /* Empty state */
  .empty { height: 100%; overflow-y: auto; padding: 36px clamp(18px, 4vw, 48px); }
  .empty h2 { margin: 0 0 8px; font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty p { margin: 0 0 24px; color: var(--muted); max-width: 52ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, transparent), var(--glass) 60%); display: flex; flex-direction: column; gap: 10px; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 12px 30px color-mix(in srgb, var(--c) 28%, transparent); }
  .card .ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 20px; color: #fff; background: var(--c); box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 55%, transparent); }
  .card b { font-size: 15px; font-weight: 600; }
  .card small { color: var(--c); font-weight: 600; font-size: 12.5px; }

  /* Loading */
  .loading { height: 100%; display: grid; place-content: center; text-align: center; padding: 24px; }
  .bars { display: flex; gap: 7px; align-items: flex-end; justify-content: center; height: 56px; margin-bottom: 18px; }
  .bars i { width: 12px; border-radius: 4px; animation: bar 1s ease-in-out infinite; }
  .bars i:nth-child(1) { background: var(--violet); height: 40%; }
  .bars i:nth-child(2) { background: var(--pink); height: 80%; animation-delay: .12s; }
  .bars i:nth-child(3) { background: var(--amber); height: 55%; animation-delay: .24s; }
  .bars i:nth-child(4) { background: var(--green); height: 100%; animation-delay: .36s; }
  .bars i:nth-child(5) { background: var(--cyan); height: 65%; animation-delay: .48s; }
  @keyframes bar { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  .loading p { margin: 0; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Mobile */
  .scrim { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(310px, 88vw); z-index: 20; transform: translateX(-100%); transition: transform .2s ease; background: rgba(12,13,36,.96); }
    body.open .side { transform: none; }
    body.open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; }
    .menu { display: block; }
    .top { padding: 12px; flex-wrap: wrap; }
    .field { flex-basis: calc(100% - 54px); }
    .meta { padding: 4px 14px 8px; }
    #stage { margin: 0 12px 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Lịch sử">
    <div class="brand">
      <div class="logo">A</div>
      <div><h1>PH Math AI</h1><p>Xem thuật toán chạy từng bước</p></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><span>Đã mô phỏng</span></div>
      <div class="stat"><b id="sCat">0</b><span>Chủ đề</span></div>
    </div>
    <button class="new" id="new">+ Thuật toán mới</button>
    <div class="side-head"><span>Lịch sử</span><button class="link" id="clear" hidden>Xóa tất cả</button></div>
    <ul id="history"></ul>
  </aside>

  <section class="main">
    <div class="top">
      <button class="menu" id="menu" aria-label="Mở lịch sử">&#9776;</button>
      <div class="field"><input id="q" placeholder="VD: Tìm kiếm các thuật toán " maxlength="200" autofocus></div>
      <button id="go" class="btn primary">Tạo mô phỏng</button>
      <button id="regen" class="btn" hidden>Tạo lại</button>
    </div>
    <div class="meta">
      <div id="status"></div>
      <div class="tools"><button class="btn" id="full" hidden>Toàn màn hình</button></div>
    </div>
    <div id="stage"></div>
  </section>
</div>
<div class="scrim" id="scrim"></div>

<script>
const $ = (id) => document.getElementById(id);
const CATS = {
  sort:  { name: 'Sắp xếp',       ico: '⇅', c: 'var(--amber)',  re: /sắp xếp|sort|nổi bọt|chèn|chọn|merge|quick|heap/ },
  graph: { name: 'Đồ thị & đường đi', ico: '◎', c: 'var(--cyan)', re: /bfs|dfs|dijkstra|đường đi|mê cung|đồ thị|graph|prim|kruskal/ },
  back:  { name: 'Quay lui',      ico: '♛', c: 'var(--pink)',   re: /quay lui|hậu|sudoku|mã đi|backtrack/ },
  rec:   { name: 'Đệ quy',        ico: '↻', c: 'var(--violet)', re: /đệ quy|tháp hà nội|fibonacci|recursion/ },
  dp:    { name: 'Quy hoạch động', ico: '▦', c: 'var(--green)', re: /quy hoạch động|dp|knapsack|balo|lcs|dãy con/ },
  other: { name: 'Khác',          ico: '✦', c: 'var(--slate)',  re: /$^/ }
};
const catOf = (p) => { const s = p.toLowerCase(); for (const k of ['sort','graph','back','rec','dp']) if (CATS[k].re.test(s)) return CATS[k]; return CATS.other; };
const SUGGESTIONS = [
  'Bài toán N quân hậu bằng quay lui', 'Mã đi tuần trên bàn cờ 5x5', 'Tháp Hà Nội',
  'Sắp xếp nổi bọt', 'Tìm đường đi ngắn nhất BFS trên mê cung', 'Giải Sudoku bằng quay lui',
  'Bài toán cái túi (balo) bằng quy hoạch động', 'Sắp xếp nhanh Quick Sort'
];
const KEY = 'algo-history-v1';
let busy = false, activeId = null, history = loadHistory();

function loadHistory() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function saveHistory() {
  for (let i = 0; i < 20; i++) {
    try { localStorage.setItem(KEY, JSON.stringify(history)); return; }
    catch { if (history.length <= 1) return; history.pop(); }
  }
}
function addHistory(problem, html) {
  history = history.filter((h) => h.problem.toLowerCase() !== problem.toLowerCase());
  const item = { id: Date.now().toString(36), problem, html, time: Date.now() };
  history.unshift(item); history = history.slice(0, 20); activeId = item.id;
  saveHistory(); renderHistory();
}
function timeAgo(t) {
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'Vừa xong'; if (m < 60) return m + ' phút trước';
  const h = Math.floor(m / 60); if (h < 24) return h + ' giờ trước';
  return Math.floor(h / 24) + ' ngày trước';
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderHistory() {
  const ul = $('history'); ul.replaceChildren();
  $('clear').hidden = !history.length;
  $('sCount').textContent = history.length;
  $('sCat').textContent = new Set(history.map((h) => catOf(h.problem).name)).size;
  if (!history.length) { ul.appendChild(el('li', 'h-empty', 'Chưa có mô phỏng nào. Các thuật toán bạn tạo sẽ được lưu ở đây.')); return; }
  history.forEach((h) => {
    const cat = catOf(h.problem);
    const li = el('li', h.id === activeId ? 'active' : ''); li.style.setProperty('--c', cat.c);
    const open = el('button', 'h-item');
    const txt = el('span', 'h-txt');
    const t = el('span', 'h-title', h.problem); t.title = h.problem;
    txt.append(t, el('span', 'h-time', cat.name + ' · ' + timeAgo(h.time)));
    open.append(el('span', 'h-ico', cat.ico), txt);
    open.onclick = () => openHistory(h);
    const del = el('button', 'h-del', '×'); del.setAttribute('aria-label', 'Xóa: ' + h.problem);
    del.onclick = (e) => {
      e.stopPropagation(); history = history.filter((x) => x.id !== h.id);
      if (activeId === h.id) { activeId = null; showEmpty(); setStatus(''); }
      saveHistory(); renderHistory();
    };
    li.append(open, del); ul.appendChild(li);
  });
}
function openHistory(h) {
  if (busy) return;
  activeId = h.id; $('q').value = h.problem;
  showFrame(h.html, h.problem);
  setStatus('Đã mở từ lịch sử.', false, false, 'ok', h.problem);
  renderHistory(); document.body.classList.remove('open');
}

function setStatus(text, isErr = false, loading = false, kind = '', problem = '') {
  const s = $('status'); s.className = isErr ? 'err' : kind; s.replaceChildren();
  if (loading) s.appendChild(el('span', 'spinner'));
  if (problem) { const c = catOf(problem); const tg = el('span', 'tag', c.name); tg.style.setProperty('--c', c.c); s.appendChild(tg); }
  s.appendChild(document.createTextNode(text));
}
function showFrame(html, problem) {
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');   // KHÔNG thêm allow-same-origin
  f.setAttribute('title', 'Mô phỏng: ' + problem);
  f.srcdoc = html;
  $('stage').classList.add('live'); $('stage').replaceChildren(f);
  $('regen').hidden = false; $('full').hidden = false;
}
function showEmpty() {
  const box = el('div', 'empty');
  const grid = el('div', 'grid');
  SUGGESTIONS.forEach((s) => {
    const cat = catOf(s);
    const b = el('button', 'card'); b.style.setProperty('--c', cat.c);
    b.append(el('span', 'ico', cat.ico), el('b', '', s), el('small', '', cat.name));
    b.onclick = () => { $('q').value = s; render(false); };
    grid.appendChild(b);
  });
  box.append(el('h2', '', 'Chọn một thuật toán, xem nó chạy từng bước'),
    el('p', '', 'Gõ tên bài toán ở thanh phía trên, hoặc bấm vào một gợi ý bên dưới. AI sẽ dựng mô phỏng tương tác cho bạn.'), grid);
  $('stage').classList.remove('live'); $('stage').replaceChildren(box);
  $('regen').hidden = true; $('full').hidden = true;
}
function showLoading() {
  const box = el('div', 'loading');
  const wrap = el('div'); const bars = el('div', 'bars');
  for (let i = 0; i < 5; i++) bars.appendChild(document.createElement('i'));
  const p = el('p'); wrap.append(bars, p); box.appendChild(wrap);
  const steps = ['AI đang phân tích bài toán...', 'AI đang viết các bước chạy...', 'Đang dựng giao diện mô phỏng...'];
  let i = 0; p.textContent = steps[0];
  box._t = setInterval(() => { i = Math.min(i + 1, steps.length - 1); p.textContent = steps[i]; }, 12000);
  $('stage').classList.remove('live'); $('stage').replaceChildren(box);
  return box;
}

async function render(force = false) {
  const problem = $('q').value.trim();
  if (busy || problem.length < 3) return;
  busy = true; $('go').disabled = $('regen').disabled = true;
  setStatus('AI viết mô phỏng, thường mất 10 - 20 giây.', false, true, '', problem);
  const loadingBox = showLoading(); document.body.classList.remove('open');
  try {
    const r = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ problem, force })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Lỗi không xác định (' + r.status + ')');
    showFrame(d.html, problem); addHistory(problem, d.html);
    setStatus(d.cached ? 'Đã lấy từ bộ nhớ đệm.' : 'Hoàn tất. Nếu chưa ưng ý, bấm "Tạo lại".', false, false, 'ok', problem);
  } catch (e) {
    const prev = history.find((h) => h.id === activeId);
    if (prev) showFrame(prev.html, prev.problem); else showEmpty();
    setStatus('Không tạo được mô phỏng: ' + e.message, true);
  } finally {
    clearInterval(loadingBox._t); busy = false; $('go').disabled = $('regen').disabled = false;
  }
}

$('go').onclick = () => render(false);
$('regen').onclick = () => render(true);
$('q').addEventListener('keydown', (e) => e.key === 'Enter' && render(false));
$('new').onclick = () => { if (busy) return; activeId = null; $('q').value = ''; $('q').focus(); showEmpty(); setStatus(''); renderHistory(); document.body.classList.remove('open'); };
$('clear').onclick = () => { if (!confirm('Xóa toàn bộ lịch sử?')) return; history = []; activeId = null; saveHistory(); renderHistory(); showEmpty(); setStatus(''); };
$('full').onclick = () => { const f = $('stage').querySelector('iframe'); if (f && f.requestFullscreen) f.requestFullscreen(); };
$('menu').onclick = () => document.body.classList.toggle('open');
$('scrim').onclick = () => document.body.classList.remove('open');
renderHistory(); showEmpty();
</script>
</body>
</html>
